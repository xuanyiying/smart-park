# ============================================================================
# 本文件不是可 apply 的清单，仅说明 Secret 的键结构。
#
# 历史事故：这里曾经是一份带值的 Secret，db-password 等字段的值是
# "${DB_PASSWORD}" 这类字面占位符。kubectl apply 不做 shell 变量替换，
# 直接 apply 会把字符串 "${DB_PASSWORD}" 当成真实密码写入集群——服务照常
# 启动，用的却是占位口令，且全程无任何报错。
#
# 正确做法：使用 scripts/k8s/create-secrets.sh 创建 Secret，它
#   - 对 db-password / jwt-secret 生成 crypto/rand 强随机值；
#   - 拒绝内容仍为占位符的支付渠道私钥文件；
#   - --dry-run 输出 YAML，可接入 GitOps / Sealed Secrets / ESO。
#
#   scripts/k8s/create-secrets.sh \
#     --namespace smart-park \
#     --wechat-private-key ./secrets/wechat_private_key.pem \
#     --alipay-private-key ./secrets/alipay_private_key.pem \
#     --alipay-public-key  ./secrets/alipay_public_key.pem
#
# 生产环境也可以使用 Sealed Secrets / External Secrets Operator 管理密钥，
# 此时本文件与脚本都不需要，由对应 Operator 的 CR 取代。
#
# 键结构（deployment.yaml 按这些键引用）：
#   db-password        数据库口令（脚本随机生成）
#   jwt-secret         JWT 签名密钥（脚本随机生成）
#   jwt-public-key     网关 JWT 验签公钥（RS256 方案，可选）
#   wechat-private-key 微信支付商户私钥（运维提供）
#   alipay-private-key 支付宝应用私钥（运维提供）
#   alipay-public-key  支付宝公钥（运维提供）
#
# 注意：本文件刻意不含 apiVersion/kind，kubectl apply 会因缺少 kind 直接
# 报错，防止误把示例当正式清单应用。
# ============================================================================
