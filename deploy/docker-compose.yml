version: '3.8'

# 说明：
# - 各服务通过 SP_* 环境变量覆盖 YAML 中的默认连接串（默认值指向 localhost，仅在容器外
#   裸跑时有效）；容器内必须连 compose 网络中的 postgres/redis/etcd。
# - 敏感信息（数据库口令、支付密钥）应通过 .env 或部署系统的 secret 机制注入，不要写死。

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart-park-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-park-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: smart-park-etcd
    environment:
      ETCD_NAME: etcd
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ports:
      - "2379:2379"

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: smart-park-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: smart-park-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:10.2.0
    container_name: smart-park-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      # 管理员口令必须通过环境注入，默认 admin/admin 不允许出现在生产。
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    restart: always

  loki:
    image: grafana/loki:2.9.0
    container_name: smart-park-loki
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: always

  promtail:
    image: grafana/promtail:2.9.0
    container_name: smart-park-promtail
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml
      - /var/log:/var/log
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: smart-park-node-exporter
    ports:
      - "9100:9100"
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:v1.48.0
    container_name: smart-park-redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"
    restart: always

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: smart-park-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/parking?sslmode=disable
    ports:
      - "9187:9187"
    restart: always

  gateway:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: smart-park-gateway
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - etcd
    environment:
      - SP_ETCD_ENDPOINTS=etcd:2379
      - SP_REDIS_ADDR=redis:6379
    restart: unless-stopped

  vehicle:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.vehicle
    container_name: smart-park-vehicle
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    environment:
      - SP_DATABASE_SOURCE=host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=parking port=5432 sslmode=disable
      - SP_REDIS_ADDR=redis:6379
      # MQTT broker 必填：未配置时车辆服务拒绝启动（道闸指令依赖它）。
      - SP_MQTT_BROKER=${SP_MQTT_BROKER:?SP_MQTT_BROKER is required}
      - SP_MQTT_PORT=${SP_MQTT_PORT:-1883}
    restart: unless-stopped

  billing:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.billing
    container_name: smart-park-billing
    ports:
      - "8002:8002"
    depends_on:
      - postgres
    environment:
      - SP_DATABASE_SOURCE=host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=parking port=5432 sslmode=disable
      - SP_REDIS_ADDR=redis:6379
    restart: unless-stopped

  payment:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.payment
    container_name: smart-park-payment
    ports:
      - "8003:8003"
    depends_on:
      - postgres
    environment:
      - SP_DATABASE_SOURCE=host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=parking port=5432 sslmode=disable
      - SP_REDIS_ADDR=redis:6379
      # 支付渠道密钥缺失时服务应拒绝启动，禁止以"能跑起来"为先。
      - SP_WECHAT_API_KEY=${SP_WECHAT_API_KEY:?SP_WECHAT_API_KEY is required}
      - SP_JWT_SECRET=${SP_JWT_SECRET:?SP_JWT_SECRET is required}
    restart: unless-stopped

  admin:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.admin
    container_name: smart-park-admin
    ports:
      - "8004:8004"
    depends_on:
      - postgres
    environment:
      - SP_DATABASE_SOURCE=host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=parking port=5432 sslmode=disable
      - SP_REDIS_ADDR=redis:6379
    restart: unless-stopped

  charging:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.charging
    container_name: smart-park-charging
    ports:
      - "8005:8005"
      - "9005:9005"
    depends_on:
      - postgres
      - redis
    environment:
      - SP_DATABASE_SOURCE=host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=parking port=5432 sslmode=disable
      - SP_REDIS_ADDR=redis:6379
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
