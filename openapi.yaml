components:
    schemas:
        AddBlacklistEntryRequest:
            type: object
            properties:
                plateNumber:
                    type: string
                reason:
                    type: string
                createdBy:
                    type: string
            description: Blacklist messages
        AddBlacklistEntryResponse:
            type: object
            properties:
                code:
                    type: integer
                    format: int32
                message:
                    type: string
                data:
                    $ref: '#/components/schemas/BlacklistEntryInfo'
        AlipayCallbackRequest:
            type: object
            properties:
                tradeStatus:
                    type: string
                tradeNo:
                    type: string
                outTradeNo:
                    type: string
                totalAmount:
                    type: string
                gmtPayment:
                    type: string
                sign:
                    type: string
        AlipayCallbackResponse:
            type: object
            properties:
                code:
                    type: string
                msg:
                    type: string
        AppliedRule:
            type: object
            properties:
                ruleId:
                    type: string
                ruleName:
                    type: string
                amount:
